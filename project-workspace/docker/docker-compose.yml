# Pho65 Café Week 5 stack -- extends the Week 3/4 baseline, does not replace it.
# Three things live in the same "app" container on purpose: the Week 3 order
# tracker, the Week 4 mobile inventory ledger, and the new Week 5 CRM
# co-pilot (/crm). Teams must prove the first two still work (regression)
# after adding the third -- that proof is a required Week 5 deliverable.
#
#   - app   : Flask order-tracker (Week 3) + inventory ledger (Week 4) + CRM co-pilot (Week 5)
#   - sshd  : the same minimal Linux + OpenSSH server from Week 3, used here
#             only for the regression check, not for a new failure sequence.
#
# This file is the correct, working configuration used for instructor
# testing and development. It is copied into the student starter package
# during packaging, with a clean (unseeded) sshd/authorized_keys -- Week 5
# has no seeded network/auth failure of its own.

# Pinned project name. Without it Compose names the project after the folder
# ("docker"), which every course week shares -- so one week's `up` can recreate
# or replace another week's containers. Week 4 pins pho65-w4 for the same reason.
name: pho65-w5

services:
  app:
    build: ./app
    container_name: pho65-app-w5
    environment:
      OVERDUE_MIN: "20"
      ORDERS_CSV: "/data/pho65-orders-valid.csv"
      NOW_OVERRIDE: "2026-01-15 12:30"
      OVERDUE_MIN_CONFIG_PATH: "/config/overdue.env"
      CRM_SEED_CSV: "/data/pho65-week5-seed.csv"
      CRM_AS_OF: "2026-02-15"
      # Week 5 Step 5 fix: phone-number corrections (shared-config, re-read per request).
      PHONE_CROSSWALK_PATH: "/config/phone-crosswalk.csv"
    volumes:
      - ../sample-data:/data:ro
      # Persistent local SQLite ledger. Reset it only with the documented fixture command.
      - ./inventory-data:/inventory-data
      # Shared, WRITABLE config: the app re-reads OVERDUE_MIN from this
      # file on every request. This is what lets a student fix the seeded
      # Stage 3 (app-logic) failure by editing one file over SSH -- no
      # container restart or Docker-in-Docker access needed.
      - ./shared-config:/config
    ports:
      # Host 5050 -> container 5000. (macOS AirPlay Receiver claims host
      # port 5000 by default, which is unrelated to Docker; Week 5 moves the
      # host-side port to 5050 to avoid that collision. `ngrok http 5050`
      # is the upstream for a phone's HTTPS URL; it does not belong in this
      # compose file.)
      - "5050:5000"
    restart: unless-stopped

  sshd:
    build: ./sshd
    container_name: pho65-sshd-w5
    ports:
      # Host port 2222 -> container port 22. THIS is the exact line the
      # Stage 1 seed changes (see instructor-only/seed/apply-seed.sh):
      # the seed edits "2222" to "9999" in the STUDENT PACKAGE'S copy of
      # this file, so host port 2222 -- the port every instruction and
      # known-answer test refers to -- is never published at all.
      - "2222:22"
    volumes:
      - ./sshd/authorized_keys:/keys/authorized_keys:ro
      # Same shared config directory as "app", mounted read-write, so the
      # student can inspect and fix /config/overdue.env from inside their
      # SSH session.
      - ./shared-config:/config
    depends_on:
      - app
    restart: unless-stopped

# Notes for instructors and students:
# - `./sshd/authorized_keys` starts as an EMPTY file. Each student generates
#   their own SSH keypair (Week 3 Step 4) and pastes their PUBLIC key into
#   this file before first `docker compose up`. Never commit or distribute
#   an actual private key.
# - Clean-baseline connection test once the stack is up and a public key is
#   installed:
#     ssh -i <path-to-private-key> pho65user@localhost -p 2222 whoami
#   Expected output: pho65user
